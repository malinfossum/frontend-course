# Ward baseline, written by the ward skill from the stacks in this repo.
# Majors are never grouped, so each gets its own PR for me to read. A block waits
# 21 days before it proposes a major, so a broken x.0.0 is fixed by then.
# Dependabot can't tell a major apart for Actions, so that block keeps its
# default wait of 3 days for every update.
version: 2
updates:
  # GitHub's own actions are grouped and may auto-merge. Ward's two pins arrive
  # together and merge only when both move to a Ward release tag. Every other
  # action gets its own PR for me to read.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-first-party:
        patterns:
          - "actions/*"
          - "github/*"
          - "dependabot/*"
        update-types: [minor, patch]
      ward:
        patterns:
          - "malinfossum/ward*"

  - package-ecosystem: npm # package.json
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 21
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # typescript-eslint stops on TS 7.0 and plans support from TS 7.1
    # (typescript-eslint/typescript-eslint#10940). Skip 7.0.x so the next
    # TypeScript PR is 7.1. If that one is still red, typescript-eslint may
    # need TS 7 side by side with TS 6 instead of a plain bump. Drop this
    # block once TypeScript 7 is merged.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0 <7.1.0"]
